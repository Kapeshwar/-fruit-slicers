```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Slicers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            touch-action: none; /* Prevent scrolling on touch devices */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Canvas for rendering the game -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="p-4 md:p-8">
        <div class="flex justify-between items-start w-full">
            <div class="text-white text-3xl md:text-5xl font-bold drop-shadow-md">
                Score: <span id="scoreDisplay" class="text-yellow-400">0</span>
            </div>
            <div class="flex space-x-2 text-2xl md:text-4xl" id="livesDisplay">
                ❤️ ❤️ ❤️
            </div>
        </div>
        
        <!-- Game Over / Start Screen -->
        <div id="menuScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70 interactive transition-opacity duration-300">
            <h1 id="menuTitle" class="text-5xl md:text-7xl font-extrabold text-white mb-4 drop-shadow-lg text-center">Fruit Slicer</h1>
            <p id="menuSubtitle" class="text-xl md:text-2xl text-gray-300 mb-8 text-center max-w-md px-4">Slide your finger or mouse to slice the fruits. Avoid the bombs!</p>
            <button id="startBtn" class="px-8 py-4 bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white text-2xl font-bold rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                Play Now
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const menuScreen = document.getElementById('menuScreen');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');
        const startBtn = document.getElementById('startBtn');

        // Game Configuration & State
        let fruits = [];
        let particles = [];
        let swipePath = [];
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let animationId;
        let frames = 0;

        // Emoji Fruits and Colors for juice splashes
        const fruitTypes = [
            { emoji: '🍎', color: '#ff3b30' },
            { emoji: '🍌', color: '#ffcc00' },
            { emoji: '🍉', color: '#ff4d4d' },
            { emoji: '🍇', color: '#af52de' },
            { emoji: '🍓', color: '#ff2d55' },
            { emoji: '🥭', color: '#ff9500' },
            { emoji: '💣', color: '#333333', isBomb: true } // Bomb
        ];

        // Resize handling
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Objects
        class Fruit {
            constructor() {
                this.radius = Math.min(canvas.width, canvas.height) * 0.08;
                this.radius = Math.max(30, Math.min(this.radius, 60)); // Clamp size
                
                // Spawn position (bottom of screen)
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = canvas.height + this.radius + 10;
                
                // Target horizontal center area to keep fruits on screen
                const centerX = canvas.width / 2;
                const directionToCenter = centerX - this.x;
                
                // Velocity
                this.vx = (directionToCenter * 0.01) + (Math.random() - 0.5) * 6;
                // Height velocity scales slightly with screen height
                const baseVy = canvas.height > 800 ? 22 : 18;
                this.vy = -(baseVy + Math.random() * 4); 
                
                // Rotation
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.2;
                
                // Type selection (Bombs appear more often as score increases)
                const bombChance = Math.min(0.2, score * 0.005);
                if (Math.random() < bombChance) {
                    this.type = fruitTypes[fruitTypes.length - 1]; // Bomb
                } else {
                    this.type = fruitTypes[Math.floor(Math.random() * (fruitTypes.length - 1))];
                }
                
                this.sliced = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.4; // Gravity
                this.angle += this.angularVelocity;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.font = `${this.radius * 1.5}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Shadow for depth
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;
                
                ctx.fillText(this.type.emoji, 0, 0);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.radius = Math.random() * 8 + 4;
                this.color = color;
                this.life = 1.0; // Fade out
                this.decay = Math.random() * 0.02 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5; // Gravity
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Math utilities for Line-Circle Intersection
        function dist2(v, w) {
            return Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
        }

        function distToSegmentSquared(p, v, w) {
            let l2 = dist2(v, w);
            if (l2 === 0) return dist2(p, v);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }

        // Input Handling (Mouse & Touch)
        let isSwiping = false;

        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startSwipe(e) {
            if (!gameActive) return;
            isSwiping = true;
            swipePath = [getPointerPos(e)];
        }

        function moveSwipe(e) {
            if (!isSwiping || !gameActive) return;
            e.preventDefault(); // Prevent scrolling
            const pos = getPointerPos(e);
            swipePath.push(pos);
            
            // Keep swipe path short to act like a blade
            if (swipePath.length > 8) {
                swipePath.shift();
            }
            
            checkCollisions();
        }

        function endSwipe() {
            isSwiping = false;
            swipePath = [];
        }

        window.addEventListener('mousedown', startSwipe);
        window.addEventListener('mousemove', moveSwipe);
        window.addEventListener('mouseup', endSwipe);
        window.addEventListener('touchstart', startSwipe, { passive: false });
        window.addEventListener('touchmove', moveSwipe, { passive: false });
        window.addEventListener('touchend', endSwipe);

        // Core Game Mechanics
        function checkCollisions() {
            if (swipePath.length < 2) return;

            const v = swipePath[swipePath.length - 2];
            const w = swipePath[swipePath.length - 1];

            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                if (fruit.sliced) continue;

                const distSq = distToSegmentSquared(fruit, v, w);
                
                if (distSq < fruit.radius * fruit.radius) {
                    sliceFruit(i);
                }
            }
        }

        function sliceFruit(index) {
            const fruit = fruits[index];
            fruit.sliced = true;

            if (fruit.type.isBomb) {
                createExplosion(fruit.x, fruit.y);
                loseLife();
                // Screen flash effect
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                score += 10;
                scoreDisplay.innerText = score;
                createSplashes(fruit.x, fruit.y, fruit.type.color);
            }
            
            // Remove the fruit
            fruits.splice(index, 1);
        }

        function createSplashes(x, y, color) {
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, ['#ff0000', '#ff9900', '#ffffff'][Math.floor(Math.random()*3)]));
            }
        }

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < 3; i++) {
                hearts += i < lives ? '❤️ ' : '🖤 ';
            }
            livesDisplay.innerText = hearts;
        }

        function loseLife() {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
                endGame();
            }
        }

        // Main Game Loop
        function spawnFruits() {
            if (frames % (Math.max(20, 60 - Math.floor(score/50))) === 0) {
                const count = Math.random() > 0.7 ? 2 : 1; // Sometimes spawn multiple
                for(let i=0; i<count; i++) {
                    fruits.push(new Fruit());
                }
            }
        }

        function update() {
            if (!gameActive) return;

            // Clear canvas with slight fade for motion blur effect on blade
            ctx.fillStyle = 'rgba(26, 26, 46, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            spawnFruits();

            // Update and draw fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.update();
                f.draw();

                // Remove fruits that fell out of bounds
                if (f.y > canvas.height + f.radius * 2 && f.vy > 0) {
                    if (!f.type.isBomb) {
                        loseLife(); // Dropped a real fruit!
                    }
                    fruits.splice(i, 1);
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw swipe blade
            if (isSwiping && swipePath.length > 1) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(swipePath[0].x, swipePath[0].y);
                for (let i = 1; i < swipePath.length; i++) {
                    ctx.lineTo(swipePath[i].x, swipePath[i].y);
                }
                
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Blade glow
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 15;
                
                // Blade core
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                
                // Blade outer edge
                ctx.lineWidth = 12;
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                ctx.stroke();
                
                ctx.restore();
            }

            frames++;
            animationId = requestAnimationFrame(update);
        }

        // Game Flow Controls
        function startGame() {
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            swipePath = [];
            frames = 0;
            gameActive = true;
            
            scoreDisplay.innerText = score;
            updateLivesDisplay();
            
            menuScreen.classList.add('hidden');
            menuScreen.classList.remove('flex');
            
            cancelAnimationFrame(animationId);
            update();
        }

        function endGame() {
            gameActive = false;
            menuTitle.innerText = "Game Over";
            menuSubtitle.innerText = `You scored ${score} points!`;
            startBtn.innerText = "Play Again";
            
            menuScreen.classList.remove('hidden');
            menuScreen.classList.add('flex');
            
            // Draw one final static frame
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0,0, canvas.width, canvas.height);
        }

        startBtn.addEventListener('click', startGame);

        // Initial setup
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
